<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Ciallo</title>

<style>
body {
    background: #f5f5f5;
    font-family: Arial;
}

#chat {
    width: 600px;
    height: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
}

.msg {
    margin: 10px 0;
}

.user {
    text-align: right;
    color: blue;
}

.ai {
    text-align: left;
    color: green;
}

#inputBox {
    width: 600px;
    margin: 10px auto;
    display: flex;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    margin-left: 5px;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="inputBox">
    <input id="input" placeholder="输入内容..." />
    <button onclick="send()">发送</button>
</div>

<script>
const API_URL = "https://backend-lilac-alpha.vercel.app/api/chat";

// 对话上下文
let messages = [
    { role: "system", content: "你是一个有帮助的助手" }
];

// 添加消息到页面
function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "ai");
    div.innerText = (role === "user" ? "你: " : "AI: ") + text;
    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = 999999;
}

// 发送消息
async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    messages.push({ role: "user", content: text });
    input.value = "";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: messages
            })
        });

        const data = await res.json();

        if (data.error) {
            addMessage("assistant", "错误：" + data.error);
            return;
        }

        const reply = data.reply;

        addMessage("assistant", reply);
        messages.push({ role: "assistant", content: reply });

    } catch (err) {
        addMessage("assistant", "请求失败：" + err.message);
    }
}

// 回车发送
document.getElementById("input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
