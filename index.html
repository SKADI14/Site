<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Whisper</title>
    <link id="siteFavicon" rel="icon" type="image/png" href="./pics/profile/vanilla.png">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

        :root {
            --bg: #f7f7f8;
            --text: #1f2937;
            --muted: #6b7280;
            --panel: #ffffff;
            --line: #e5e7eb;
            --line-strong: #d1d5db;
            --accent: #111827;
            --assistant: #ffffff;
            --user: #f1f5f9;
            --max-content-width: 780px;
            --max-input-width: 820px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 16% -10%, #ffffff 0%, transparent 45%),
                radial-gradient(circle at 100% 0%, #eceff3 0%, transparent 38%),
                var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .top-tools {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
            user-select: none;
        }

        .top-tools-label {
            font-size: 12px;
            color: var(--muted);
            line-height: 1;
        }

        .agent-switch {
            position: relative;
            width: 38px;
            height: 22px;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background: #e5e7eb;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .agent-switch::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(17, 24, 39, 0.22);
            transition: transform 0.2s ease;
        }

        .agent-switch.active {
            background: #111827;
            border-color: #111827;
        }

        .agent-switch.active::after {
            transform: translateX(16px);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 26px 16px 170px;
            scroll-behavior: smooth;
        }

        .empty {
            max-width: var(--max-content-width);
            margin: 14vh auto 0;
            text-align: center;
            color: var(--muted);
            animation: fade-up 0.45s ease;
        }

        .empty h1 {
            margin: 0;
            font-size: clamp(28px, 4.5vw, 42px);
            line-height: 1.1;
            color: #111827;
            letter-spacing: 0.2px;
        }

        .empty p {
            margin: 14px 0 0;
            font-size: 15px;
        }

        .message-row {
            animation: fade-up 0.24s ease;
        }

        .message-wrap {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .message-wrap.user {
            justify-content: flex-end;
            padding-left: 56px;
        }

        .bubble {
            max-width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
            line-height: 1.65;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 3px 14px rgba(17, 24, 39, 0.03);
        }

        .bubble.assistant {
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            padding: 4px 0;
        }

        .bubble.user {
            background: var(--user);
        }

        .composer-shell {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 14px 12px 16px;
            background: linear-gradient(180deg, rgba(247, 247, 248, 0) 0%, rgba(247, 247, 248, 0.95) 32%, rgba(247, 247, 248, 1) 100%);
            backdrop-filter: blur(1px);
        }

        .composer {
            max-width: var(--max-input-width);
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--line-strong);
            border-radius: 22px;
            padding: 10px 12px 10px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            box-shadow: 0 8px 28px rgba(17, 24, 39, 0.1);
        }

        #input {
            flex: 1;
            border: 0;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 180px;
            font: inherit;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background: transparent;
            padding: 6px 2px;
        }

        #input::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            border: 0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            color: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 16px;
            transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.2s ease;
        }

        .send-btn:hover {
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            max-width: var(--max-input-width);
            margin: 8px auto 0;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .jm-card {
            max-width: var(--max-content-width);
            margin: 8px auto 0;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #ffffff;
            padding: 12px;
            box-shadow: 0 3px 14px rgba(17, 24, 39, 0.03);
        }

        .jm-card-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px;
            color: #111827;
        }

        .jm-card-meta {
            font-size: 12px;
            color: #6b7280;
            margin: 0 0 10px;
        }

        .jm-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .jm-btn {
            border: 1px solid #d1d5db;
            background: #f8fafc;
            color: #111827;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .jm-btn.primary {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }

        .jm-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .jm-progress {
            margin: 10px 0 0;
            font-size: 12px;
            color: #6b7280;
        }

        .egg-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: rgba(10, 10, 10, 0.94);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .egg-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            touch-action: none;
        }

        body.egg-active .app {
            pointer-events: none;
            user-select: none;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .top-tools {
                top: 10px;
                right: 10px;
                padding: 6px 8px;
            }

            .top-tools-label {
                font-size: 11px;
            }

            .chat-area {
                padding: 58px 10px 156px;
            }

            .egg-overlay {
                background-position: 36% center;
            }

            .message-wrap {
                padding: 6px 0;
            }

            .message-wrap.user {
                padding-left: 38px;
            }

            .bubble {
                font-size: 14px;
                border-radius: 12px;
                padding: 11px 12px;
            }

            .bubble.assistant {
                border-radius: 0;
                padding: 4px 0;
            }

            .composer {
                border-radius: 18px;
                padding: 8px 10px 8px 12px;
            }

            .send-btn {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }

            .hint {
                font-size: 11px;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <div class="top-tools" role="group" aria-label="对话设置">
            <span class="top-tools-label" id="agentLabel">Agent 开</span>
            <button
                id="agentToggle"
                class="agent-switch active"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Agent 开关"
            ></button>
        </div>

        <section id="chat" class="chat-area" aria-live="polite">
            <div class="empty" id="emptyState">
                <h1></h1>
                <p>才不想和你说话呢~</p>
            </div>
        </section>

        <div class="composer-shell">
            <div class="composer">
                <textarea id="input" placeholder="你不好" rows="1"></textarea>
                <button class="send-btn" id="sendBtn" type="button" onclick="send()" aria-label="发送消息">↑</button>
            </div>
            <div class="hint">按 Enter 发送，Shift + Enter 换行</div>
        </div>
    </main>

    <div id="eggOverlay" class="egg-overlay" aria-hidden="true"></div>

    <script>
        const API_URL = "https://backend-lilac-alpha.vercel.app/api/chat";
        const JSZIP_CDN_URLS = [
            "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
            "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"
        ];
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendBtnEl = document.getElementById("sendBtn");
        const agentToggleEl = document.getElementById("agentToggle");
        const agentLabelEl = document.getElementById("agentLabel");
        const emptyStateEl = document.getElementById("emptyState");
        const welcomeTitleEl = emptyStateEl ? emptyStateEl.querySelector("h1") : null;
        const eggOverlayEl = document.getElementById("eggOverlay");
        const siteFaviconEl = document.getElementById("siteFavicon");
        const SYSTEM_SETTING_URL = "./docs/system_setting.txt";
        const WELCOMES_URL = "./docs/welcomes.txt";
        const EGG_IMAGE_PATHS = ["./pics/egg/Priestess.jpg"];
        const EGG_AUDIO_PATH = "./sound/Priestess.m4a";
        const EGG_TITLE = "Don't forget me, doctor.";
        const DEFAULT_FAVICON_PATH = "./pics/profile/vanilla.png";
        const EGG_FAVICON_PATH = "./pics/profile/Priestess.jpg";
        const EGG_TRIGGER_COUNT = 5;
        const EGG_TRIGGER_WINDOW_MS = 1200;
        const DEFAULT_SYSTEM_PROMPT = "你是一个有帮助的助手";
        const DEFAULT_WELCOME_TITLE = "今天想聊点什么？";
        const AGENT_STORAGE_KEY = "vw-agent-enabled";
        const ZIP_FETCH_CONCURRENCY = Math.min(8, Math.max(3, (navigator.hardwareConcurrency || 4) - 1));

        let isSending = false;
        let agentEnabled = true;
        let systemPrompt = DEFAULT_SYSTEM_PROMPT;
        let eggClickTimestamps = [];
        let isEggOverlayActive = false;
        let jsZipLoadPromise = null;
        const eggAudio = new Audio(EGG_AUDIO_PATH);

        eggAudio.preload = "auto";

        let messages = [
            { role: "system", content: systemPrompt }
        ];

        function loadAgentPreference() {
            try {
                const stored = localStorage.getItem(AGENT_STORAGE_KEY);
                if (stored === "0") {
                    agentEnabled = false;
                } else if (stored === "1") {
                    agentEnabled = true;
                }
            } catch (err) {
                console.warn("读取 Agent 开关偏好失败。", err);
            }
        }

        function persistAgentPreference() {
            try {
                localStorage.setItem(AGENT_STORAGE_KEY, agentEnabled ? "1" : "0");
            } catch (err) {
                console.warn("保存 Agent 开关偏好失败。", err);
            }
        }

        function syncAgentToggleUi() {
            if (!agentToggleEl) {
                return;
            }

            agentToggleEl.classList.toggle("active", agentEnabled);
            agentToggleEl.setAttribute("aria-checked", agentEnabled ? "true" : "false");
            if (agentLabelEl) {
                agentLabelEl.textContent = agentEnabled ? "Agent 开" : "Agent 关";
            }
        }

        async function loadSystemSetting() {
            try {
                const res = await fetch(SYSTEM_SETTING_URL, {
                    cache: "no-store"
                });

                if (!res.ok) {
                    throw new Error("加载设定失败: " + res.status);
                }

                const text = (await res.text()).trim();
                if (text) {
                    systemPrompt = text;
                    messages[0] = { role: "system", content: systemPrompt };
                }
            } catch (err) {
                console.warn("读取 system_setting 失败，使用默认设定。", err);
            }
        }

        function parseWelcomeLines(text) {
            const lines = text.split(/\r?\n/);
            const entries = [];

            for (const raw of lines) {
                const line = raw.trim();
                if (!line) {
                    continue;
                }

                const match = line.match(/^(.*\S)\s+([0-9]+(?:\.[0-9]+)?)$/);
                if (!match) {
                    continue;
                }

                const content = match[1].trim();
                const weight = Number(match[2]);
                if (!content || !Number.isFinite(weight) || weight <= 0) {
                    continue;
                }

                entries.push({ content, weight });
            }

            return entries;
        }

        function pickWeightedWelcome(entries) {
            const totalWeight = entries.reduce(function(sum, entry) {
                return sum + entry.weight;
            }, 0);

            if (totalWeight <= 0) {
                return "";
            }

            let random = Math.random() * totalWeight;
            for (const entry of entries) {
                random -= entry.weight;
                if (random <= 0) {
                    return entry.content;
                }
            }

            return entries[entries.length - 1].content;
        }

        async function loadWelcomeTitle() {
            if (!welcomeTitleEl) {
                return;
            }

            welcomeTitleEl.textContent = DEFAULT_WELCOME_TITLE;

            try {
                const res = await fetch(WELCOMES_URL, {
                    cache: "no-store"
                });

                if (!res.ok) {
                    throw new Error("加载欢迎语失败: " + res.status);
                }

                const text = await res.text();
                const entries = parseWelcomeLines(text);
                entries.push({ content: DEFAULT_WELCOME_TITLE, weight: 1 });
                if (!entries.length) {
                    return;
                }

                const selected = pickWeightedWelcome(entries);
                if (selected) {
                    welcomeTitleEl.textContent = selected;
                }
            } catch (err) {
                console.warn("读取 welcomes 失败，使用默认欢迎语。", err);
            }
        }

        function escapeHtml(text) {
            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };
            return text.replace(/[&<>"']/g, function(m) {
                return map[m];
            });
        }

        function setComposerState() {
            const hasText = inputEl.value.trim().length > 0;
            sendBtnEl.disabled = isSending || !hasText;
        }

        function autoResizeTextarea() {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function shouldAutoFocusInput() {
            const coarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
            const mobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            return !(coarsePointer || mobileUA);
        }

        function triggerDownload(url) {
            if (!url) {
                return;
            }

            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function saveBlobToFile(blob, fileName) {
            const objectUrl = URL.createObjectURL(blob);

            try {
                const link = document.createElement("a");
                link.href = objectUrl;
                link.download = fileName || "download.zip";
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } finally {
                setTimeout(function() {
                    URL.revokeObjectURL(objectUrl);
                }, 1000);
            }
        }

        async function fetchBlob(url, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(function() {
                controller.abort();
            }, timeoutMs || 30000);

            try {
                const response = await fetch(url, {
                    method: "GET",
                    mode: "cors",
                    credentials: "omit",
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error("下载失败：" + response.status);
                }

                return await response.blob();
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function triggerDirectFileDownload(url) {
            if (!url) {
                return;
            }

            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function triggerDirectBatchDownload(files, progressEl) {
            for (let i = 0; i < files.length; i += 1) {
                const file = files[i];
                progressEl.textContent = "正在触发直链下载 " + (i + 1) + " / " + files.length;
                triggerDirectFileDownload(file.url);
                await new Promise(function(resolve) {
                    setTimeout(resolve, 250);
                });
            }
        }

        function isRetriableError(error) {
            const msg = error && error.message ? String(error.message) : "";
            return /超时|timeout|502|503|504|ERR_CONNECTION_CLOSED|Failed to fetch|NetworkError/i.test(msg);
        }

        async function fetchBlobWithRetry(url, timeoutMs, retryCount) {
            let lastError = null;
            const retries = typeof retryCount === "number" ? retryCount : 2;

            for (let attempt = 0; attempt <= retries; attempt += 1) {
                try {
                    return await fetchBlob(url, timeoutMs);
                } catch (err) {
                    lastError = err;
                    if (attempt >= retries || !isRetriableError(err)) {
                        throw err;
                    }
                    await new Promise(function(resolve) {
                        setTimeout(resolve, 500 * (attempt + 1));
                    });
                }
            }

            throw lastError || new Error("下载失败");
        }

        async function downloadBlob(url, fileName, timeoutMs) {
            const blob = await fetchBlobWithRetry(url, timeoutMs, 2);
            saveBlobToFile(blob, fileName);
        }

        async function loadScript(url) {
            return new Promise(function(resolve, reject) {
                const script = document.createElement("script");
                script.src = url;
                script.async = true;
                script.onload = function() {
                    resolve();
                };
                script.onerror = function() {
                    reject(new Error("加载脚本失败"));
                };
                document.head.appendChild(script);
            });
        }

        async function ensureJsZipLoaded() {
            if (window.JSZip) {
                return;
            }

            if (!jsZipLoadPromise) {
                jsZipLoadPromise = (async function() {
                    let lastError = null;
                    for (const url of JSZIP_CDN_URLS) {
                        try {
                            await loadScript(url);
                            if (window.JSZip) {
                                return;
                            }
                        } catch (err) {
                            lastError = err;
                        }
                    }
                    throw lastError || new Error("无法加载 JSZip");
                })();
            }

            await jsZipLoadPromise;
        }

        async function mapWithConcurrency(items, limit, mapper) {
            const results = new Array(items.length);
            let nextIndex = 0;

            async function worker() {
                while (true) {
                    const currentIndex = nextIndex;
                    nextIndex += 1;
                    if (currentIndex >= items.length) {
                        return;
                    }
                    results[currentIndex] = await mapper(items[currentIndex], currentIndex);
                }
            }

            const workers = [];
            const workerCount = Math.max(1, Math.min(limit, items.length));
            for (let i = 0; i < workerCount; i += 1) {
                workers.push(worker());
            }

            await Promise.all(workers);
            return results;
        }

        async function buildZipInBrowser(task, progressEl) {
            const files = Array.isArray(task && task.files) ? task.files : [];
            if (!files.length) {
                throw new Error("下载清单为空");
            }

            await ensureJsZipLoaded();
            const zip = new window.JSZip();
            let successCount = 0;
            let failedCount = 0;

            async function decodeScrambledImageIfNeeded(fileBlob, file) {
                const segmentation = Number(file && file.segmentation ? file.segmentation : 0);
                if (!Number.isFinite(segmentation) || segmentation <= 1) {
                    return fileBlob;
                }

                const imageBitmap = await createImageBitmap(fileBlob);
                try {
                    const width = imageBitmap.width;
                    const height = imageBitmap.height;

                    if (!width || !height || segmentation <= 0) {
                        return fileBlob;
                    }

                    const srcCanvas = document.createElement("canvas");
                    srcCanvas.width = width;
                    srcCanvas.height = height;
                    const srcCtx = srcCanvas.getContext("2d");
                    srcCtx.drawImage(imageBitmap, 0, 0);

                    const dstCanvas = document.createElement("canvas");
                    dstCanvas.width = width;
                    dstCanvas.height = height;
                    const dstCtx = dstCanvas.getContext("2d");

                    const over = height % segmentation;
                    const baseMove = Math.floor(height / segmentation);

                    for (let i = 0; i < segmentation; i += 1) {
                        let move = baseMove;
                        let ySrc = height - (baseMove * (i + 1)) - over;
                        let yDst = baseMove * i;

                        if (i === 0) {
                            move += over;
                        } else {
                            yDst += over;
                        }

                        dstCtx.drawImage(
                            srcCanvas,
                            0,
                            ySrc,
                            width,
                            move,
                            0,
                            yDst,
                            width,
                            move
                        );
                    }

                    const outputType = fileBlob.type && fileBlob.type.startsWith("image/") ? fileBlob.type : "image/webp";
                    const decodedBlob = await new Promise(function(resolve, reject) {
                        dstCanvas.toBlob(function(blob) {
                            if (!blob) {
                                reject(new Error("图片还原失败"));
                                return;
                            }
                            resolve(blob);
                        }, outputType, 0.98);
                    });

                    return decodedBlob;
                } finally {
                    imageBitmap.close();
                }
            }

            let finishedCount = 0;
            const prepared = await mapWithConcurrency(files, ZIP_FETCH_CONCURRENCY, async function(file, index) {
                try {
                    const fileBlob = await fetchBlobWithRetry(file.url, 30000, 2);
                    const decodedBlob = await decodeScrambledImageIfNeeded(fileBlob, file);
                    finishedCount += 1;
                    progressEl.textContent = "正在拉取并还原文件 " + finishedCount + " / " + files.length;
                    return {
                        ok: true,
                        name: file.name || ("image_" + (index + 1) + ".jpg"),
                        blob: decodedBlob
                    };
                } catch (err) {
                    finishedCount += 1;
                    progressEl.textContent = "正在拉取并还原文件 " + finishedCount + " / " + files.length;
                    return {
                        ok: false
                    };
                }
            });

            for (const item of prepared) {
                if (item && item.ok) {
                    zip.file(item.name, item.blob);
                    successCount += 1;
                } else {
                    failedCount += 1;
                }
            }

            if (successCount === 0) {
                throw new Error("所有文件拉取失败");
            }

            progressEl.textContent = "正在本地打包 ZIP...";
            const zipBlob = await zip.generateAsync(
                {
                    type: "blob",
                    compression: "STORE"
                },
                function(meta) {
                    progressEl.textContent = "正在本地打包 ZIP..." + Math.floor(meta.percent) + "%";
                }
            );

            return {
                blob: zipBlob,
                successCount,
                failedCount
            };
        }

        async function startJmZipDownload(task, progressEl, downloadBtn) {
            const files = Array.isArray(task && task.files) ? task.files : [];
            if (!files.length) {
                progressEl.textContent = "没有可用的下载清单";
                return;
            }

            downloadBtn.disabled = true;
            progressEl.textContent = "正在尝试浏览器本地打包 ZIP...";
            try {
                const localZip = await buildZipInBrowser(task, progressEl);
                saveBlobToFile(localZip.blob, task.zipFileName || (task.albumTitle ? task.albumTitle + ".zip" : "jm-download.zip"));
                progressEl.textContent = "ZIP 下载已开始（浏览器本地打包，成功 " + localZip.successCount + "，失败 " + localZip.failedCount + "）";
            } catch (err) {
                try {
                    progressEl.textContent = "本地打包失败，正在切换直链逐张下载...";
                    await triggerDirectBatchDownload(files, progressEl);
                    progressEl.textContent = "已触发直链逐张下载（不走后端下载代理）";
                } catch (fallbackErr) {
                    progressEl.textContent = "ZIP 下载失败：" + (fallbackErr && fallbackErr.message ? fallbackErr.message : err.message);
                }
            } finally {
                downloadBtn.disabled = false;
            }
        }

        function addJmDownloadCard(task) {
            if (!task || !Array.isArray(task.files) || !task.files.length) {
                return;
            }

            if (emptyStateEl) {
                emptyStateEl.style.display = "none";
            }

            const row = document.createElement("div");
            row.className = "message-row";

            const wrap = document.createElement("div");
            wrap.className = "message-wrap assistant";

            const card = document.createElement("div");
            card.className = "jm-card";

            const title = document.createElement("p");
            title.className = "jm-card-title";
            title.textContent = "JM 网页下载：" + (task.albumTitle || ("JM" + task.albumId));

            const meta = document.createElement("p");
            meta.className = "jm-card-meta";
            meta.textContent = "车号 " + task.albumId + " · 文件数 " + task.files.length + (task.truncated ? ("（已截断，最多 " + task.maxFiles + "）") : "");

            const actions = document.createElement("div");
            actions.className = "jm-actions";

            const downloadBtn = document.createElement("button");
            downloadBtn.type = "button";
            downloadBtn.className = "jm-btn primary";
            downloadBtn.textContent = "一键 ZIP 下载";

            const openBtn = document.createElement("button");
            openBtn.type = "button";
            openBtn.className = "jm-btn";
            openBtn.textContent = "打开在线页面";

            const progress = document.createElement("p");
            progress.className = "jm-progress";
            progress.textContent = "点击按钮开始下载";

            downloadBtn.addEventListener("click", function() {
                startJmZipDownload(task, progress, downloadBtn);
            });

            openBtn.addEventListener("click", function() {
                if (task.albumUrl) {
                    triggerDownload(task.albumUrl);
                }
            });

            actions.appendChild(downloadBtn);
            actions.appendChild(openBtn);

            card.appendChild(title);
            card.appendChild(meta);
            card.appendChild(actions);
            card.appendChild(progress);
            wrap.appendChild(card);
            row.appendChild(wrap);
            chatEl.appendChild(row);
            scrollToBottom();
        }

        function pickRandomEggImagePath() {
            if (!EGG_IMAGE_PATHS.length) {
                return "";
            }
            const index = Math.floor(Math.random() * EGG_IMAGE_PATHS.length);
            return EGG_IMAGE_PATHS[index];
        }

        function setEggOverlayActive(nextActive) {
            if (!eggOverlayEl) {
                return;
            }

            isEggOverlayActive = nextActive;
            document.body.classList.toggle("egg-active", isEggOverlayActive);

            if (isEggOverlayActive) {
                const imagePath = pickRandomEggImagePath();
                eggOverlayEl.style.backgroundImage = imagePath ? 'url("' + imagePath + '")' : "none";
                eggOverlayEl.classList.add("active");
                document.title = EGG_TITLE;
                if (siteFaviconEl) {
                    siteFaviconEl.href = EGG_FAVICON_PATH;
                }
                eggAudio.currentTime = 0;
                eggAudio.play().catch(function(err) {
                    console.warn("彩蛋音频播放失败。", err);
                });
                if (document.activeElement && typeof document.activeElement.blur === "function") {
                    document.activeElement.blur();
                }
            } else {
                eggOverlayEl.classList.remove("active");
                eggAudio.pause();
                eggAudio.currentTime = 0;
            }
        }

        function handleRapidClickToggle() {
            const now = Date.now();
            eggClickTimestamps.push(now);
            eggClickTimestamps = eggClickTimestamps.filter(function(ts) {
                return now - ts <= EGG_TRIGGER_WINDOW_MS;
            });

            if (eggClickTimestamps.length >= EGG_TRIGGER_COUNT) {
                eggClickTimestamps = [];
                setEggOverlayActive(!isEggOverlayActive);
            }
        }

        function addMessage(role, text) {
            if (emptyStateEl) {
                emptyStateEl.style.display = "none";
            }

            const row = document.createElement("div");
            row.className = "message-row";

            const safeText = escapeHtml(text);
            row.innerHTML =
                '<div class="message-wrap ' + role + '">' +
                '<div class="bubble ' + role + '">' + safeText + '</div>' +
                "</div>";

            chatEl.appendChild(row);
            scrollToBottom();
        }

        async function send() {
            if (isEggOverlayActive) {
                return;
            }

            if (messages[0].content !== systemPrompt) {
                messages[0] = { role: "system", content: systemPrompt };
            }

            const text = inputEl.value.trim();
            if (!text || isSending) {
                return;
            }

            addMessage("user", text);
            messages.push({ role: "user", content: text });

            inputEl.value = "";
            autoResizeTextarea();

            isSending = true;
            setComposerState();

            const loadingRow = document.createElement("div");
            loadingRow.className = "message-row";
            loadingRow.innerHTML =
                '<div class="message-wrap assistant">' +
                '<div class="bubble assistant">思考中...</div>' +
                "</div>";
            chatEl.appendChild(loadingRow);
            scrollToBottom();

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: messages,
                        agentEnabled: agentEnabled
                    })
                });

                const data = await res.json();
                loadingRow.remove();

                if (data.error) {
                    addMessage("assistant", "错误：" + data.error);
                    return;
                }

                const reply = data.reply || "没有返回内容";
                addMessage("assistant", reply);
                messages.push({ role: "assistant", content: reply });

                if (data.jmDownload) {
                    addJmDownloadCard(data.jmDownload);
                } else if (data.downloadUrl) {
                    triggerDownload(data.downloadUrl);
                }
            } catch (err) {
                loadingRow.remove();
                addMessage("assistant", "请求失败：" + err.message);
            } finally {
                isSending = false;
                setComposerState();
                if (shouldAutoFocusInput()) {
                    inputEl.focus();
                }
            }
        }

        inputEl.addEventListener("input", function() {
            if (isEggOverlayActive) {
                return;
            }

            autoResizeTextarea();
            setComposerState();
        });

        inputEl.addEventListener("keydown", function(e) {
            if (isEggOverlayActive) {
                e.preventDefault();
                return;
            }

            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        document.addEventListener("click", handleRapidClickToggle);

        if (agentToggleEl) {
            agentToggleEl.addEventListener("click", function() {
                if (isEggOverlayActive) {
                    return;
                }
                agentEnabled = !agentEnabled;
                syncAgentToggleUi();
                persistAgentPreference();
            });
        }

        loadAgentPreference();
        syncAgentToggleUi();
        autoResizeTextarea();
        setComposerState();
        if (siteFaviconEl) {
            siteFaviconEl.href = DEFAULT_FAVICON_PATH;
        }
        loadSystemSetting();
        loadWelcomeTitle();
    </script>
</body>
</html>
