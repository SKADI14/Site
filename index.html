<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciallo!!</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

        :root {
            --bg: #f7f7f8;
            --text: #1f2937;
            --muted: #6b7280;
            --panel: #ffffff;
            --line: #e5e7eb;
            --line-strong: #d1d5db;
            --accent: #111827;
            --assistant: #ffffff;
            --user: #f1f5f9;
            --max-content-width: 780px;
            --max-input-width: 820px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 16% -10%, #ffffff 0%, transparent 45%),
                radial-gradient(circle at 100% 0%, #eceff3 0%, transparent 38%),
                var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 26px 16px 170px;
            scroll-behavior: smooth;
        }

        .empty {
            max-width: var(--max-content-width);
            margin: 14vh auto 0;
            text-align: center;
            color: var(--muted);
            animation: fade-up 0.45s ease;
        }

        .empty h1 {
            margin: 0;
            font-size: clamp(28px, 4.5vw, 42px);
            line-height: 1.1;
            color: #111827;
            letter-spacing: 0.2px;
        }

        .empty p {
            margin: 14px 0 0;
            font-size: 15px;
        }

        .message-row {
            animation: fade-up 0.24s ease;
        }

        .message-wrap {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 8px 0;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .avatar.assistant {
            background: #111827;
            color: #f9fafb;
        }

        .avatar.user {
            background: #dbeafe;
            color: #0f172a;
        }

        .bubble {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
            line-height: 1.65;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 3px 14px rgba(17, 24, 39, 0.03);
        }

        .bubble.assistant {
            background: var(--assistant);
        }

        .bubble.user {
            background: var(--user);
        }

        .composer-shell {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 14px 12px 16px;
            background: linear-gradient(180deg, rgba(247, 247, 248, 0) 0%, rgba(247, 247, 248, 0.95) 32%, rgba(247, 247, 248, 1) 100%);
            backdrop-filter: blur(1px);
        }

        .composer {
            max-width: var(--max-input-width);
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--line-strong);
            border-radius: 22px;
            padding: 10px 12px 10px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            box-shadow: 0 8px 28px rgba(17, 24, 39, 0.1);
        }

        #input {
            flex: 1;
            border: 0;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 180px;
            font: inherit;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background: transparent;
            padding: 6px 2px;
        }

        #input::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            border: 0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            color: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 16px;
            transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.2s ease;
        }

        .send-btn:hover {
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            max-width: var(--max-input-width);
            margin: 8px auto 0;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .chat-area {
                padding: 18px 10px 156px;
            }

            .message-wrap {
                gap: 10px;
                padding: 6px 0;
            }

            .avatar {
                width: 24px;
                height: 24px;
                border-radius: 7px;
                font-size: 11px;
            }

            .bubble {
                font-size: 14px;
                border-radius: 12px;
                padding: 11px 12px;
            }

            .composer {
                border-radius: 18px;
                padding: 8px 10px 8px 12px;
            }

            .send-btn {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }

            .hint {
                font-size: 11px;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section id="chat" class="chat-area" aria-live="polite">
            <div class="empty" id="emptyState">
                <h1>今天想聊点什么？</h1>
                <p>才不想和你说话呢~</p>
            </div>
        </section>

        <div class="composer-shell">
            <div class="composer">
                <textarea id="input" placeholder="你不好" rows="1"></textarea>
                <button class="send-btn" id="sendBtn" type="button" onclick="send()" aria-label="发送消息">↑</button>
            </div>
            <div class="hint">按 Enter 发送，Shift + Enter 换行</div>
        </div>
    </main>

    <script>
        const API_URL = "https://backend-lilac-alpha.vercel.app/api/chat";
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendBtnEl = document.getElementById("sendBtn");
        const emptyStateEl = document.getElementById("emptyState");
        const SYSTEM_SETTING_URL = "./docs/system_setting.txt";
        const DEFAULT_SYSTEM_PROMPT = "你是一个有帮助的助手";

        let isSending = false;
        let systemPrompt = DEFAULT_SYSTEM_PROMPT;

        let messages = [
            { role: "system", content: systemPrompt }
        ];

        async function loadSystemSetting() {
            try {
                const res = await fetch(SYSTEM_SETTING_URL, {
                    cache: "no-store"
                });

                if (!res.ok) {
                    throw new Error("加载设定失败: " + res.status);
                }

                const text = (await res.text()).trim();
                if (text) {
                    systemPrompt = text;
                    messages[0] = { role: "system", content: systemPrompt };
                }
            } catch (err) {
                console.warn("读取 system_setting 失败，使用默认设定。", err);
            }
        }

        function escapeHtml(text) {
            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };
            return text.replace(/[&<>"']/g, function(m) {
                return map[m];
            });
        }

        function setComposerState() {
            const hasText = inputEl.value.trim().length > 0;
            sendBtnEl.disabled = isSending || !hasText;
        }

        function autoResizeTextarea() {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function addMessage(role, text) {
            if (emptyStateEl) {
                emptyStateEl.style.display = "none";
            }

            const row = document.createElement("div");
            row.className = "message-row";

            const avatarLabel = role === "user" ? "你" : "AI";
            const safeText = escapeHtml(text);
            row.innerHTML =
                '<div class="message-wrap">' +
                '<div class="avatar ' + role + '">' + avatarLabel + '</div>' +
                '<div class="bubble ' + role + '">' + safeText + '</div>' +
                "</div>";

            chatEl.appendChild(row);
            scrollToBottom();
        }

        async function send() {
            if (messages[0].content !== systemPrompt) {
                messages[0] = { role: "system", content: systemPrompt };
            }

            const text = inputEl.value.trim();
            if (!text || isSending) {
                return;
            }

            addMessage("user", text);
            messages.push({ role: "user", content: text });

            inputEl.value = "";
            autoResizeTextarea();

            isSending = true;
            setComposerState();

            const loadingRow = document.createElement("div");
            loadingRow.className = "message-row";
            loadingRow.innerHTML =
                '<div class="message-wrap">' +
                '<div class="avatar assistant">AI</div>' +
                '<div class="bubble assistant">思考中...</div>' +
                "</div>";
            chatEl.appendChild(loadingRow);
            scrollToBottom();

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ messages: messages })
                });

                const data = await res.json();
                loadingRow.remove();

                if (data.error) {
                    addMessage("assistant", "错误：" + data.error);
                    return;
                }

                const reply = data.reply || "没有返回内容";
                addMessage("assistant", reply);
                messages.push({ role: "assistant", content: reply });
            } catch (err) {
                loadingRow.remove();
                addMessage("assistant", "请求失败：" + err.message);
            } finally {
                isSending = false;
                setComposerState();
                inputEl.focus();
            }
        }

        inputEl.addEventListener("input", function() {
            autoResizeTextarea();
            setComposerState();
        });

        inputEl.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        autoResizeTextarea();
        setComposerState();
        loadSystemSetting();
    </script>
</body>
</html>
