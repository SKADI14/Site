<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>输入加3</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        p {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="number" id="inputBox" placeholder="请输入数字">
        <p id="output">结果：</p>
    </div>

    <script>
        const inputBox = document.getElementById("inputBox");
        const output = document.getElementById("output");

        inputBox.addEventListener("input", function() {
            const value = Number(inputBox.value);
            if (!isNaN(value)) {
                output.textContent = "结果：" + (value + 3);
            } else {
                output.textContent = "结果：";
            }
        });
    </script>
</body>
</html>
